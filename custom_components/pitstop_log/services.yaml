update_odometer:
  name: Mettre à jour le kilométrage
  description: >-
    Met à jour le kilométrage d'un véhicule. Sans date, met à jour le
    kilométrage actuel ; avec une date, enregistre ou modifie le point
    de l'historique pour cette date.
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    km:
      name: Kilométrage
      description: Nouveau kilométrage (km).
      required: true
      example: 12345
      selector:
        number:
          min: 0
          max: 2000000
          step: 1
          unit_of_measurement: km
    date:
      name: Date
      description: Date du relevé (AAAA-MM-JJ). Optionnel — aujourd'hui par défaut.
      required: false
      example: "2026-11-16"
      selector:
        date:

update_registration:
  name: Mettre à jour l'immatriculation
  description: >-
    Met à jour l'immatriculation (carte grise) d'un véhicule.
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    registration:
      name: Immatriculation
      description: Nouvelle immatriculation (carte grise).
      required: true
      example: "AB-123-CD"
      selector:
        text:

update_purchase_date:
  name: Mettre à jour la date d'achat
  description: >-
    Met à jour la date d'achat (mise en service) d'un véhicule.
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    date:
      name: Date
      description: Nouvelle date d'achat (AAAA-MM-JJ).
      required: true
      example: "2020-01-01"
      selector:
        date:

update_brand_model:
  name: Mettre à jour la marque et le modèle
  description: >-
    Met à jour la marque et le modèle d'un véhicule. La marque doit faire
    partie de la liste brands.json ; le logo est mis à jour automatiquement.
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    brand:
      name: Marque
      description: Nouvelle marque (issue de la liste brands.json).
      required: true
      example: "Yamaha"
      selector:
        text:
    model:
      name: Modèle
      description: Nouveau modèle du véhicule.
      required: true
      example: "MT-07"
      selector:
        text:
    model_year:
      name: Année-modèle
      description: Année-modèle du véhicule. Optionnel.
      required: false
      example: 2022
      selector:
        number:
          min: 1900
          max: 2100
          step: 1
          mode: box
    photo_base64:
      name: Photo du véhicule (base64)
      description: >-
        Photo du véhicule encodée en base64 (ou data URL).
        Sauvegardée automatiquement dans /config/www/pitstop_log/photos/.
        Optionnel.
      required: false
      selector:
        text:
          multiline: true
    registration:
      name: Immatriculation
      description: Nouvelle immatriculation (carte grise). Optionnel.
      required: false
      example: "AB-123-CD"
      selector:
        text:
    purchase_date:
      name: Date d'achat
      description: Nouvelle date d'achat / mise en service (AAAA-MM-JJ). Optionnel.
      required: false
      example: "2020-01-01"
      selector:
        date:

add_maintenance_done:
  name: Ajouter une entrée au carnet d'entretien
  description: >-
    Ajoute une intervention réalisée au carnet d'entretien du véhicule.
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    date:
      name: Date
      description: Date de l'intervention (AAAA-MM-JJ).
      required: true
      example: "2025-05-01"
      selector:
        date:
    km:
      name: Kilométrage
      description: Kilométrage au moment de l'intervention.
      required: true
      example: 12345
      selector:
        number:
          min: 0
          max: 2000000
          step: 1
          unit_of_measurement: km
    actions:
      name: Actions effectuées
      description: Description des actions réalisées.
      required: true
      example: "Vidange, remplacement du filtre à huile"
      selector:
        text:
          multiline: true
    cost:
      name: Coût
      description: Coût de l'intervention (optionnel).
      required: false
      example: 89.5
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
    invoice_path:
      name: Chemin de la facture
      description: >-
        Chemin ou URL locale de la photo de facture
        (ex. /local/pitstop_log/invoices/mafacture.jpg). Optionnel.
      required: false
      example: "/local/pitstop_log/invoices/mafacture.jpg"
      selector:
        text:
    invoice_base64:
      name: Image de facture (base64)
      description: >-
        Contenu de la photo de facture encodé en base64.
        Sauvegardé automatiquement dans /config/www/pitstop_log/invoices/.
        Optionnel.
      required: false
      selector:
        text:
          multiline: true
    plan_id:
      name: Nature d'entretien
      description: >-
        Identifiant de la nature d'entretien à réinitialiser
        (entretien périodique). Optionnel.
      required: false
      example: "moto_yamaha_vidange"
      selector:
        text:

add_maintenance_plan:
  name: Ajouter une nature d'entretien
  description: >-
    Ajoute une règle d'entretien périodique (en km et/ou en mois).
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    plan_name:
      name: Nom de la nature
      description: Nom de l'entretien périodique.
      required: true
      example: "Vidange moteur"
      selector:
        text:
    interval_km:
      name: Intervalle (km)
      description: Fréquence en kilomètres. Optionnel si l'intervalle en mois est défini.
      required: false
      example: 6000
      selector:
        number:
          min: 1
          max: 200000
          step: 1
          unit_of_measurement: km
    interval_months:
      name: Intervalle (mois)
      description: Fréquence en mois. Optionnel si l'intervalle en km est défini.
      required: false
      example: 12
      selector:
        number:
          min: 1
          max: 240
          step: 1
          unit_of_measurement: mois
    last_km:
      name: Dernier kilométrage effectué
      description: Kilométrage de la dernière réalisation. Optionnel.
      required: false
      example: 12000
      selector:
        number:
          min: 0
          max: 2000000
          step: 1
          unit_of_measurement: km
    last_date:
      name: Date de la dernière réalisation
      description: Date de la dernière réalisation (AAAA-MM-JJ). Optionnel.
      required: false
      example: "2025-05-01"
      selector:
        date:

update_maintenance_plan:
  name: Modifier une nature d'entretien
  description: >-
    Modifie une nature d'entretien périodique d'un véhicule
    (nom et/ou intervalles en km / mois). Passer 0 efface un intervalle.
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    plan_id:
      name: Identifiant de la nature
      description: Identifiant de la nature à modifier (attribut plan_id du capteur de la nature).
      required: true
      example: "moto_yamaha_vidange"
      selector:
        text:
    plan_name:
      name: Nom de la nature
      description: Nouveau nom (vide = conserve l'actuel).
      required: false
      example: "Vidange moteur"
      selector:
        text:
    interval_km:
      name: Intervalle (km)
      description: Fréquence en kilomètres (0 = efface l'intervalle). Optionnel.
      required: false
      example: 6000
      selector:
        number:
          min: 0
          max: 200000
          step: 1
          unit_of_measurement: km
    interval_months:
      name: Intervalle (mois)
      description: Fréquence en mois (0 = efface l'intervalle). Optionnel.
      required: false
      example: 12
      selector:
        number:
          min: 0
          max: 240
          step: 1
          unit_of_measurement: mois

delete_maintenance_plan:
  name: Supprimer une nature d'entretien
  description: >-
    Supprime une nature d'entretien périodique d'un véhicule.
    Les entrées du carnet d'entretien sont conservées.
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    plan_id:
      name: Identifiant de la nature
      description: Identifiant de la nature à supprimer (attribut plan_id du capteur de la nature).
      required: true
      example: "moto_yamaha_vidange"
      selector:
        text:

update_maintenance:
  name: Modifier une entrée du carnet d'entretien
  description: >-
    Modifie une entrée du carnet d'entretien d'un véhicule
    (date, kilométrage, nature, coût, facture).
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    index:
      name: Index
      description: Index de l'entrée dans le carnet d'entretien (0 = plus récente).
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10000
          step: 1
    date:
      name: Date
      description: Date de l'entretien (AAAA-MM-JJ).
      required: true
      example: "2026-11-16"
      selector:
        date:
    km:
      name: Kilométrage
      description: Kilométrage au moment de l'entretien.
      required: true
      example: 15432
      selector:
        number:
          min: 0
          max: 2000000
          step: 1
          unit_of_measurement: km
    actions:
      name: Natures
      description: >-
        Nature(s) de l'entretien — une chaîne ou une liste de chaînes
        (ex. ["Vidange", "Filtre à huile"]).
      required: true
      example: '["Vidange", "Filtre à huile"]'
      selector:
        text:
    cost:
      name: Coût
      description: Coût de l'entretien. Optionnel.
      required: false
      example: 89.5
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          unit_of_measurement: "€"
    invoice_base64:
      name: Facture (base64)
      description: Photo ou PDF de la facture encodé en base64. Optionnel.
      required: false
      selector:
        text:

delete_maintenance:
  name: Supprimer une entrée du carnet d'entretien
  description: >-
    Supprime une entrée du carnet d'entretien d'un véhicule.
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    index:
      name: Index
      description: Index de l'entrée dans le carnet d'entretien (0 = plus récente).
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 10000
          step: 1

delete_odometer_point:
  name: Supprimer un relevé de kilométrage
  description: >-
    Supprime le point d'historique du kilométrage correspondant à la date
    donnée. Si c'était le relevé le plus récent, le kilométrage actuel
    redevient le maximum des relevés restants.
  fields:
    vehicle_id:
      name: Véhicule
      description: Identifiant ou nom du véhicule.
      required: true
      example: "moto_yamaha"
      selector:
        text:
    date:
      name: Date
      description: Date du relevé à supprimer (AAAA-MM-JJ).
      required: true
      example: "2026-11-16"
      selector:
        date:
