name: Release

# Publie automatiquement une release GitHub quand la version du manifest
# change. HACS/Marketplace se base sur les releases pour afficher la version
# installable et proposer les mises à jour.
# Les notes de release ne contiennent QUE la liste des changements
# (git log) depuis le tag précédent — pas de texte standard.
# workflow_dispatch permet de rejouer le workflow à la main (test).
on:
  push:
    branches:
      - main
    paths:
      - "custom_components/pitstop_log/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt (historique complet, pour git log et les tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraire la version du manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/pitstop_log/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Version absente du manifest" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Générer les notes de release (changelog depuis le tag précédent)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Tag précédent (tri semver décroissant), hors version courante
          PREV=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -n 1 || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            TITLE="## 🚀 Changements depuis ${PREV}"
            LOG_CMD="git log --format=-\\ %s ${RANGE}"
          else
            TITLE="## 🚀 Changements"
            LOG_CMD="git log --format=-\\ %s -n 20 HEAD"
          fi
          {
            echo "$TITLE"
            echo ""
            eval "$LOG_CMD" | grep -v "^chore" || echo "- (aucun commit listé)"
          } > /tmp/release-notes.md
          echo "Notes générées (tag précédent : ${PREV:-aucun})."

      - name: Créer la release si elle n'existe pas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "La release $VERSION existe déjà, rien à faire."
            exit 0
          fi
          # Les versions beta/rc sont marquées pre-release : le Marketplace
          # ne les propose qu'aux utilisateurs ayant activé les versions bêta.
          PRERELEASE_ARGS=""
          if echo "$VERSION" | grep -Eq 'beta|rc'; then
            PRERELEASE_ARGS="--prerelease"
            echo "Version $VERSION détectée comme bêta -> pre-release."
          fi

          git tag "$VERSION" 2>/dev/null || true
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE_ARGS
          echo "Release $VERSION publiée."
